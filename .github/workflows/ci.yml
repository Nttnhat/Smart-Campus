name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: smart_campus_tdtu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, iconv

      - name: Kiểm tra cú pháp PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Unit test (router, GPS, tìm kiếm, marker xung đột...)
        run: node --test tests/*.test.js

      - name: Nạp database
        run: mysql -h127.0.0.1 -uroot -proot smart_campus_tdtu < database/smart_campus_tdtu.sql

      - name: Test tích hợp API (PHP + MySQL thật)
        env:
          DB_HOST: 127.0.0.1
          DB_PASS: root
          SC_API_BASE: http://127.0.0.1:8099
        run: |
          php -S 127.0.0.1:8099 -t . > php-server.log 2>&1 &
          sleep 2
          node --test tests/api.integration.test.js tests/location-share.test.js
          cat php-server.log | tail -20
